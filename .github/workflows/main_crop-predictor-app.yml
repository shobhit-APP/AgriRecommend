name: Deploy Crop Recommendation ML Model to DigitalOcean

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read # Required for actions/checkout

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Debug directory structure
        run: |
          ls -la
          ls -la Model/ || echo "Model directory not found"
          ls -la Recommend.py || echo "Recommend.py not found"
          ls -la requirements.txt || echo "requirements.txt not found"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Create and activate virtual environment
        run: |
          python -m venv venv
          source venv/bin/activate
          pip install --upgrade pip

      - name: Install dependencies
        run: |
          pip install -r requirements.txt || echo "Failed to install dependencies"

      - name: Zip artifact for deployment
        run: |
          zip -r release.zip Model/ Recommend.py requirements.txt
        shell: bash

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: crop-recommendation-app
          path: release.zip
          if-no-files-found: error # Fail if no files are found

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: Production

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: crop-recommendation-app

      - name: Unzip artifact
        run: unzip release.zip

      - name: Deploy to DigitalOcean
        uses: appleboy/scp-action@master
        with:
          host: 159.65.158.161
          username: root
          password: ${{ secrets.DROPLET_PASSWORD }}
          source: "Model/,Recommend.py,requirements.txt"
          target: "/root/crop-recommendation/"

      - name: Start recommendation service
        uses: appleboy/ssh-action@master
        with:
          host: 159.65.158.161
          username: root
          password: ${{ secrets.DROPLET_PASSWORD }}
          timeout: 120s  # Increase timeout further to 120 seconds
          script: |
            cd /root/crop-recommendation
            echo "Step 1: Activating virtual environment"
            source venv/bin/activate || { echo "Failed to activate virtual environment"; exit 1; }
            echo "Step 2: Killing existing process"
            pkill -f 'python3 Recommend.py' || true
            echo "Step 3: Verifying no process is running"
            ps aux | grep '[p]ython3 Recommend.py' || echo "No existing process found"
            echo "Step 4: Starting app with nohup"
            nohup python3 Recommend.py > app.log 2>&1 &
            echo "Step 5: Waiting for app to start"
            sleep 2
            echo "Step 6: Checking if app.log was created"
            if [ -f "app.log" ]; then
              echo "app.log created, checking contents"
              cat app.log
            else
              echo "app.log not created, app failed to start"
              exit 1
            fi
            echo "Step 7: Checking if process is running"
            ps aux | grep '[p]ython3 Recommend.py' || echo "Process not running"
            echo "Deployment completed"
