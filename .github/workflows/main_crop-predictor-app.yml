name: Deploy Crop Recommendation ML Model to Azure VM

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Debug directory structure
        run: |
          ls -la
          ls -la Model/ || echo "Model directory not found"
          ls -la Recommend.py || echo "Recommend.py not found"
          ls -la requirements.txt || echo "requirements.txt not found"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Create and activate virtual environment
        run: |
          python -m venv venv
          source venv/bin/activate
          python --version

      - name: Install dependencies
        run: |
          source venv/bin/activate
          pip install -r requirements.txt || echo "Failed to install dependencies"

      - name: Zip artifact for deployment
        run: |
          zip -r release.zip Model/ Recommend.py requirements.txt
          ls -l release.zip
        shell: bash

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: crop-recommendation-app
          path: release.zip
          if-no-files-found: error

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: Production

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: crop-recommendation-app

      - name: Unzip artifact
        run: |
          unzip release.zip
          ls -l

      - name: Deploy to Azure VM
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.AZURE_VM_HOST }}
          username: ${{ secrets.AZURE_VM_USERNAME }}
          password: ${{ secrets.AZURE_VM_PASSWORD }}
          source: "Model/,Recommend.py,requirements.txt"
          target: "/home/${{ secrets.AZURE_VM_USERNAME }}/crop-recommendation/"
          strip_components: 0

      - name: Start recommendation service on Azure VM
        uses: appleboy/ssh-action@v0.1.7
        with:
          host: ${{ secrets.AZURE_VM_HOST }}
          username: ${{ secrets.AZURE_VM_USERNAME }}
          password: ${{ secrets.AZURE_VM_PASSWORD }}
          script: |
            set -e
            cd /home/${{ secrets.AZURE_VM_USERNAME }}/crop-recommendation

            sudo chown $USER:$USER Recommend.py requirements.txt
            chmod 644 Recommend.py requirements.txt
            sudo chown $USER:$USER app.log || true
            chmod 644 app.log || true

            if sudo netstat -tuln | grep :8080; then
              sudo lsof -i :8080 | awk '{print $2}' | sudo xargs kill -9 || true
              sleep 2
            fi

            sudo systemctl stop crop-recommendation.service || true
            rm -rf venv
            python3 -m venv venv
            source venv/bin/activate

            for i in {1..3}; do
              pip install --no-cache-dir -r requirements.txt && break
              sleep 5
              if [ $i -eq 3 ]; then exit 1; fi
            done

            sudo tee /etc/systemd/system/crop-recommendation.service > /dev/null << EOF
            [Unit]
            Description=Crop Recommendation Flask App
            After=network.target

            [Service]
            Type=simple
            User=$USER
            WorkingDirectory=/home/$USER/crop-recommendation
            Environment="PORT=8080"
            ExecStart=/home/$USER/crop-recommendation/venv/bin/python /home/$USER/crop-recommendation/Recommend.py
            Restart=always
            StandardOutput=append:/home/$USER/crop-recommendation/app.log
            StandardError=append:/home/$USER/crop-recommendation/app.log
            MemoryMax=2500M

            [Install]
            WantedBy=multi-user.target
            EOF

            sudo systemctl daemon-reload
            sudo systemctl enable crop-recommendation.service
            sudo systemctl restart crop-recommendation.service

