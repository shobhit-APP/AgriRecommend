name: Deploy Crop Recommendation ML Model to DigitalOcean

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Debug directory structure
        run: |
          ls -la
          ls -la Models/ || echo "Models directory not found"
          ls -la Recommend.py || echo "Recommend.py not found"
          ls -la requirements.txt || echo "requirements.txt not found"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Create and activate virtual environment
        run: |
          python -m venv venv
          source venv/bin/activate
          python --version

      - name: Install dependencies
        run: |
          source venv/bin/activate
          pip install -r requirements.txt || echo "Failed to install dependencies"

      - name: Zip artifact for deployment
        run: |
          zip -r release.zip Models/ Recommend.py requirements.txt
          ls -l release.zip
        shell: bash

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: crop-recommendation-app
          path: release.zip
          if-no-files-found: error

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: Production

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: crop-recommendation-app

      - name: Unzip artifact
        run: |
          unzip release.zip
          ls -l

      - name: Deploy to DigitalOcean
        uses: appleboy/scp-action@v0.1.5
        with:
          host: 159.65.158.161
          username: root
          password: ${{ secrets.DROPLET_PASSWORD }}
          source: "Models/,Recommend.py,requirements.txt"
          target: "/root/crop-recommendation/"
          strip_components: 0

      - name: Start recommendation service
        uses: appleboy/ssh-action@v0.1.6
        with:
          host: 159.65.158.161
          username: root
          password: ${{ secrets.DROPLET_PASSWORD }}
          script: |
            set -e

            cd /root/crop-recommendation

            echo "Fixing file permissions..."
            chown root:root Recommend.py requirements.txt
            chmod 644 Recommend.py requirements.txt
            chown root:root app.log || true
            chmod 644 app.log || true

            echo "Checking port 8080..."
            if netstat -tuln | grep :8080; then
              echo "Port 8080 is in use, killing process..."
              lsof -i :8080 | grep LISTEN | awk '{print $2}' | xargs kill -9 || true
              sleep 2
            fi

            echo "Checking memory usage..."
            free -m

            echo "Stopping existing service..."
            systemctl stop crop-recommendation.service || true

            echo "Setting up virtual environment..."
            rm -rf venv
            python3 -m venv venv
            source venv/bin/activate

            echo "Installing dependencies with retry..."
            for i in {1..3}; do
              pip install --no-cache-dir -r requirements.txt && break
              echo "pip install failed, retrying ($i/3)..."
              sleep 5
              if [ $i -eq 3 ]; then
                echo "Failed to install dependencies after 3 attempts"
                exit 1
              fi
            done

            echo "Setting up systemd service..."
            cat > /etc/systemd/system/crop-recommendation.service << 'EOF'
            [Unit]
            Description=Crop Recommendation Flask App
            After=network.target

            [Service]
            Type=simple
            User=root
            WorkingDirectory=/root/crop-recommendation
            Environment="PORT=8080"
            ExecStart=/root/crop-recommendation/venv/bin/python /root/crop-recommendation/Recommend.py
            Restart=always
            StandardOutput=append:/root/crop-recommendation/app.log
            StandardError=append:/root/crop-recommendation/app.log
            MemoryMax=2500M

            [Install]
            WantedBy=multi-user.target
            EOF

            echo "Reloading systemd and starting service..."
            systemctl daemon-reload
            systemctl enable crop-recommendation.service
            systemctl restart crop-recommendation.service

            echo "Waiting for Flask app to start (up to 5 minutes)..."
            for i in {1..30}; do
              if curl --fail --silent --show-error http://localhost:8080/; then
                echo "Flask app is responding"
                break
              fi
              echo "Attempt $i/30: Flask app not yet responding, waiting 10 seconds..."
              sleep 10
              if [ $i -eq 30 ]; then
                echo "Flask app failed to start within 5 minutes"
                systemctl status crop-recommendation.service
                journalctl -u crop-recommendation.service -n 50
                cat app.log
                free -m
                exit 1
              fi
            done

            if systemctl is-active --quiet crop-recommendation.service; then
              echo "Flask app started successfully via systemd"
            else
              echo "Failed to start Flask app via systemd"
              systemctl status crop-recommendation.service
              journalctl -u crop-recommendation.service -n 50
              cat app.log
              free -m
              exit 1
            fi
