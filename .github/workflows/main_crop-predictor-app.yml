name: Deploy Crop Recommendation ML Model to DigitalOcean

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read # Required for actions/checkout

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Debug directory structure
        run: |
          ls -la
          ls -la Model/ || echo "Model directory not found"
          ls -la Recommend.py || echo "Recommend.py not found"
          ls -la requirements.txt || echo "requirements.txt not found"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Create and activate virtual environment
        run: |
          python -m venv venv
          source venv/bin/activate
          pip install --upgrade pip

      - name: Install dependencies
        run: |
          pip install -r requirements.txt || echo "Failed to install dependencies"

      - name: Zip artifact for deployment
        run: |
          zip -r release.zip Model/ Recommend.py requirements.txt
        shell: bash

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: crop-recommendation-app
          path: release.zip
          if-no-files-found: error # Fail if no files are found

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: Production

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: crop-recommendation-app

      - name: Unzip artifact
        run: unzip release.zip

      - name: Deploy to DigitalOcean
        uses: appleboy/scp-action@master
        with:
          host: 159.65.158.161
          username: root
          password: ${{ secrets.DROPLET_PASSWORD }}
          source: "Model/,Recommend.py,requirements.txt"
          target: "/root/crop-recommendation/"

      - name: Start recommendation service
        uses: appleboy/ssh-action@master
        with:
          host: 159.65.158.161
          username: root
          password: ${{ secrets.DROPLET_PASSWORD }}
          script: |
            cd /root/crop-recommendation
            # Fix permissions
            chown -R root:root Model Recommend.py requirements.txt
            # Create virtual environment if it doesn't exist
            if [ ! -d "venv" ]; then
              python3 -m venv venv
            fi
            # Activate virtual environment and install dependencies
            source venv/bin/activate
            python3 -m pip install --upgrade pip
            python3 -m pip install -r requirements.txt || echo "Dependencies installation failed"
            # Check if port 8080 is in use
            if netstat -tuln | grep -q 8080; then
              echo "Port 8080 is in use, attempting to free it"
              pkill -f 'python3' || true
            fi
            # Kill existing process if running
            pkill -f 'python3 Recommend.py' || true
            # Set environment variable for port
            export PORT=8080
            # Start recommendation script with nohup
            nohup python3 Recommend.py > app.log 2>&1 &
            sleep 2
            # Check if app.log was created
            if [ -f "app.log" ]; then
              echo "app.log created, checking contents"
              cat app.log
            else
              echo "app.log not created, app failed to start"
            fi
            # Check if process is running
            ps aux | grep 'python3 Recommend.py' || echo "Process not running"
            echo "Deployment completed"
